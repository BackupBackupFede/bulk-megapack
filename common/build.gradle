plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${rootProject.mod_id}-common"
}

neoForge {
    // Compile common code against un-modified (Mojang-mapped) Minecraft.
    neoFormVersion = rootProject.neoformVersion
}

dependencies {
    // Both loaders bundle Mixin + MixinExtras, so common may use them (provided, not shipped).
    compileOnly "net.fabricmc:sponge-mixin:${rootProject.mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
}

// One extra source folder per Minecraft line, for the rare class that cannot be written once:
// where a vanilla method changed shape, a mixin handler has to change with it. Loader modules
// compile common's allSource, so they pick this up as well.
sourceSets.main.java.srcDir rootProject.mcObfuscated ? 'src/main/java-legacy' : 'src/main/java-modern'
